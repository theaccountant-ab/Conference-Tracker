name: Update conferences (web search)

# SEPARATE, opt-in pipeline. It does NOT touch the daily email job (update.yml)
# or the tracked-URL job (update-tracked.yml).
#
# It researches a curated list of conference names (watchlist.txt) with the
# web-search source — Gemini's Google Search grounding finds each conference's
# next/most-recent edition (dates, deadline, URL) and upserts it into
# conferences.csv. This is a replacement path for the SSRN announcement emails,
# which SSRN is retiring at the end of 2026.
#
# Manual trigger only: each run first narrows watchlist.txt to the conferences
# that are *due* — those without an upcoming edition already on file — then
# web-searches just those. Because it shares the free-tier GEMINI_API_KEY with
# the daily job, it is left as workflow_dispatch; add a `schedule:` block below
# once you are comfortable with the quota usage.
on:
  workflow_dispatch:
    inputs:
      file:
        description: "Watchlist file to research (one conference name per line)."
        required: false
        default: "watchlist.txt"
      all:
        description: "Search the whole watchlist, not just the lapsed subset."
        required: false
        default: "false"

# Avoid colliding with the other jobs if two try to write conferences.csv at once.
concurrency:
  group: conference-csv-write
  cancel-in-progress: false

jobs:
  update-search:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Select conferences due for searching
        env:
          WATCHLIST: ${{ github.event.inputs.file || 'watchlist.txt' }}
          SEARCH_ALL: ${{ github.event.inputs.all || 'false' }}
        run: |
          if [ "$SEARCH_ALL" = "true" ]; then
            cp "$WATCHLIST" due.txt
          else
            python scripts/due_watchlist.py "$WATCHLIST" conferences.csv > due.txt
          fi
          echo "Due conferences to search: $(grep -c . due.txt || echo 0)"

      - name: Web-search the due conferences, dedupe, and refresh
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # GA4 Measurement ID (public) — keeps click tracking on the rebuilt page.
          CT_GA_MEASUREMENT_ID: G-X2ZFQPG4G7
        run: |
          python -m conference_tracker update-search due.txt
          python -m conference_tracker dedupe
          python -m conference_tracker refresh-status
          python -m conference_tracker build-site docs/index.html

      - name: Commit changes
        run: |
          git config user.name "conference-tracker-bot"
          git config user.email "actions@github.com"
          # Re-sync in case another job pushed while this run was searching.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git add conferences.csv docs/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Update conferences via web search ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No changes to commit."
          fi
