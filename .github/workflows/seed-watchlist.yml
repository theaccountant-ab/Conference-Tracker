name: Seed watchlist from a listing sitemap

# One-off / occasional bulk seed of conference NAMES into watchlist.txt from a
# public conference-listing site, given its sitemap URL at dispatch time. The
# target site is a runtime input, so this workflow is source-agnostic. Seeded
# names are only candidates — the web-search pipeline (update-search) then
# researches and verifies each into conferences.csv, so this cannot corrupt
# existing data.
#
# Runs on a GitHub runner (open network; aggregator sites may be unreachable
# from sandboxed dev environments). Defaults to a DRY RUN that reports the tier
# distribution and sample parses without writing anything.
on:
  workflow_dispatch:
    inputs:
      sitemap_url:
        description: "Sitemap URL of the listing site."
        required: true
      path_filter:
        description: "Only pages whose URL path contains this substring."
        required: false
        default: "/c/"
      exclude_tier:
        description: "Tier to drop (leave blank to keep all)."
        required: false
        default: "3"
      exclude_unranked:
        description: "Also drop Unranked venues."
        required: false
        default: "false"
      dry_run:
        description: "Report only, write nothing (recommended first)."
        required: false
        default: "true"

concurrency:
  group: conference-csv-write
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Harvest conference names
        env:
          SITEMAP_URL: ${{ github.event.inputs.sitemap_url }}
          PATH_FILTER: ${{ github.event.inputs.path_filter || '/c/' }}
          EXCLUDE_TIER: ${{ github.event.inputs.exclude_tier }}
          EXCLUDE_UNRANKED: ${{ github.event.inputs.exclude_unranked || 'false' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
        run: |
          args="--sitemap-url \"$SITEMAP_URL\" --path-filter \"$PATH_FILTER\" --exclude-tier \"$EXCLUDE_TIER\""
          [ "$EXCLUDE_UNRANKED" = "true" ] && args="$args --exclude-unranked"
          [ "$DRY_RUN" = "true" ] && args="$args --dry-run"
          eval python scripts/seed_from_listing.py $args

      - name: Commit expanded watchlist
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "conference-tracker-bot"
          git config user.email "actions@github.com"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git add watchlist.txt
          if ! git diff --cached --quiet; then
            git commit -m "Seed watchlist from aggregator sitemap ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No new names to add."
          fi
